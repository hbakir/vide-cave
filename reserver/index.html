-cid-x2n6z5iw>Vos données servent uniquement à cette vente. <a href="/donnees" data-astro-cid-x2n6z5iw>En savoir plus</a>.</p></main><footer>Vente privée par Hicham Bakir, Pully · Objets vendus en l'état, sans garantie ·<a href="/qui-vend">Qui vend ?</a> · <a href="/donnees">Vos données</a></footer></body></html><script type="module">var e=document.getElementById(`resa`),t=document.getElementById(`etat`),n=new URLSearchParams(location.search).get(`objet`);if(n){let e=document.querySelector(`option[data-id="${CSS.escape(n)}"]`);e&&(e.selected=!0)}e.addEventListener(`submit`,async n=>{n.preventDefault();let r=e.querySelector(`button`);r.disabled=!0,t.textContent=`Envoi en cours…`;try{let n=await(await fetch(e.action,{method:`POST`,headers:{Accept:`application/json`},body:new FormData(e)})).json();if(!n.success)throw Error(n.message);e.reset(),t.textContent=`Merci ! Votre réservation est bien arrivée. Je vous confirme par e-mail, puis je vous envoie la demande de paiement TWINT.`}catch{t.textContent=`L'envoi a échoué. Réessayez dans un instant, ou écrivez à l'adresse indiquée dans « Qui vend ? ».`,r.disabled=!1}});</script>
